name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        type: string

permissions:
  contents: read

env:
  LIBJPEG_TURBO_VERSION: 3.2.0

jobs:
  # Build the native from source on each platform, run the smoke test against
  # it, and upload the staged set for the release workflow.
  natives-macos:
    runs-on: macos-14   # arm64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22
          cache: maven

      - name: Install build tools
        run: brew install ninja nasm

      - name: Fetch libjpeg-turbo source
        run: |
          mkdir -p build
          curl -sfL "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${LIBJPEG_TURBO_VERSION}/libjpeg-turbo-${LIBJPEG_TURBO_VERSION}.tar.gz" | tar xz -C build

      - name: Build native
        run: build-natives/macos-arm64.sh

      - name: Test against built native
        run: ./mvnw -B clean install

      - uses: actions/upload-artifact@v4
        with:
          name: natives-macos-arm64
          path: natives/src/main/resources/turbojpeg-natives/macos-arm64/
          if-no-files-found: error

  natives-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22
          cache: maven

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            nasm
            curl

      - name: Fetch libjpeg-turbo source
        run: |
          mkdir -p build
          curl -sfL "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${LIBJPEG_TURBO_VERSION}/libjpeg-turbo-${LIBJPEG_TURBO_VERSION}.tar.gz" | tar xz -C build

      - name: Build native
        run: ./build-natives/windows-x64.sh

      - name: Test against built native
        shell: bash
        run: ./mvnw -B clean install

      - uses: actions/upload-artifact@v4
        with:
          name: natives-windows-x64
          path: natives/src/main/resources/turbojpeg-natives/windows-x64/
          if-no-files-found: error

  natives-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22
          cache: maven

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build nasm patchelf

      - name: Fetch libjpeg-turbo source
        run: |
          mkdir -p build
          curl -sfL "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${LIBJPEG_TURBO_VERSION}/libjpeg-turbo-${LIBJPEG_TURBO_VERSION}.tar.gz" | tar xz -C build

      - name: Build native
        run: build-natives/linux-x64.sh

      - name: Test against built native
        run: ./mvnw -B clean install

      - uses: actions/upload-artifact@v4
        with:
          name: natives-linux-x64
          path: natives/src/main/resources/turbojpeg-natives/linux-x64/
          if-no-files-found: error
